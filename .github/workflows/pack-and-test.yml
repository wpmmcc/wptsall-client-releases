name: Pack and Test

# Canonical copy: install-client/workflows/pack-and-test.yml
# Sync to wpmmcc/wptsall-client-releases via packaging/webui/sync-public-repo.sh
#
# Desktop jobs remain but are out of current scope (see CURRENT-FOCUS.md).
# WebUI: download signed kits, repack, test install-webui.sh against kits.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0)'
        required: true
      kit_tag:
        description: 'Kit prerelease tag (e.g. kits-webui-v2.1.0)'
        required: true
      publish:
        description: 'Publish packed release assets (optional; install tests do not require this)'
        type: boolean
        default: false
      type:
        description: 'Package type'
        type: choice
        options:
          - webui
          - desktop
        default: webui

jobs:
  pack-desktop:
    if: inputs.type == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            kinds: tree,deb,appimage
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            kinds: tree,deb,appimage
          - os: windows-latest
            platform: windows-x86_64
            kinds: tree,nsis,portable
          - os: windows-11-arm
            platform: windows-aarch64
            kinds: tree,portable
          - os: macos-latest
            platform: darwin-aarch64
            kinds: tree,dmg
          - os: macos-latest
            platform: darwin-x86_64
            kinds: tree,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download kit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/kits
          gh release download ${{ inputs.kit_tag }} -p "kit-${{ matrix.platform }}.tar.gz" -D dist/kits || echo "::warning::Kit not available for ${{ matrix.platform }}"
      - name: Pack kit to release
        shell: bash
        if: hashFiles(format('dist/kits/kit-{0}.tar.gz', matrix.platform)) != ''
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
          WPTSALL_PACK_KINDS: ${{ matrix.kinds }}
          KIT: dist/kits/kit-${{ matrix.platform }}.tar.gz
        run: bash packaging/desktop/pack-kit-to-release.sh || bash scripts/pack-kit-to-release.sh
      - name: Upload artifacts
        if: hashFiles('dist/release-assets/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/release-assets/*

  pack-webui:
    if: inputs.type == 'webui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-arm
            platform: windows-aarch64
          - os: macos-latest
            platform: darwin-aarch64
          - os: macos-latest
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download signed kit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/kits
          gh release download "${{ inputs.kit_tag }}" \
            -p "kit-webui-${{ matrix.platform }}.tar.gz" \
            -p "kit-webui-${{ matrix.platform }}.tar.gz.minisig" \
            -p "RELEASE-SHA256SUMS-webui.txt" \
            -p "RELEASE-SHA256SUMS-webui.txt.minisig" \
            -D dist/kits
          test -f "dist/kits/kit-webui-${{ matrix.platform }}.tar.gz"
      - name: Verify minisign
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash shared/install-minisign-ci.sh
          PUB='RWR7lrdabZEEywfWEfrRJXIyP5h+LHEabOA8JFiNJ3vGLpNtppyabHfP'
          minisign -Vm "dist/kits/kit-webui-${{ matrix.platform }}.tar.gz" -P "$PUB" \
            -x "dist/kits/kit-webui-${{ matrix.platform }}.tar.gz.minisig"
      - name: Pack kit (user tarball)
        shell: bash
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
          KIT: dist/kits/kit-webui-${{ matrix.platform }}.tar.gz
        run: |
          if [ -x packaging/webui/pack-kit-to-release.sh ]; then
            bash packaging/webui/pack-kit-to-release.sh
          else
            mkdir -p dist/release-assets dist/staging
            tar -xzf "$KIT" -C dist/staging
            tar -czf "dist/release-assets/wptsall-client-webui-${{ inputs.version }}-${{ matrix.platform }}.tar.gz" -C dist/staging .
          fi
          mkdir -p ci-out
          cp dist/kits/kit-webui-${{ matrix.platform }}.tar.gz ci-out/
          cp dist/kits/kit-webui-${{ matrix.platform }}.tar.gz.minisig ci-out/
          cp dist/release-assets/* ci-out/ 2>/dev/null || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webui-${{ matrix.platform }}
          path: ci-out/*
  install-test-webui-sh:
    needs: pack-webui
    if: always() && needs.pack-webui.result == 'success' && inputs.type == 'webui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-${{ matrix.platform }}
          path: ci-assets
      - name: Install minisign
        run: bash shared/install-minisign-ci.sh
      - name: Serve signed kit + run install-webui.sh
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p /tmp/kit-http
          cp ci-assets/kit-webui-${{ matrix.platform }}.tar.gz /tmp/kit-http/
          cp ci-assets/kit-webui-${{ matrix.platform }}.tar.gz.minisig /tmp/kit-http/ || true
          # SUMS for this one file
          (cd /tmp/kit-http && sha256sum kit-webui-*.tar.gz > RELEASE-SHA256SUMS-webui.txt || shasum -a 256 kit-webui-*.tar.gz > RELEASE-SHA256SUMS-webui.txt)
          python3 -m http.server 8765 --directory /tmp/kit-http &
          sleep 1
          PREFIX="$HOME/.local/opt/wptsall-client-ci"
          rm -rf "$PREFIX"
          WPTSALL_DOWNLOAD_BASE="http://127.0.0.1:8765" \
            bash installers/install-webui.sh --version "${WPTSALL_VERSION}" --prefix "$PREFIX" --no-service --no-link
          bash shared/smoke-test-webui.sh "$PREFIX"

  install-test-webui-ps1:
    needs: pack-webui
    if: always() && needs.pack-webui.result == 'success' && inputs.type == 'webui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-arm
            platform: windows-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-${{ matrix.platform }}
          path: ci-assets
      - name: Extract kit and smoke
        shell: bash
        run: |
          mkdir -p "$LOCALAPPDATA/wptsall-client"
          tar -xzf "ci-assets/kit-webui-${{ matrix.platform }}.tar.gz" -C "$LOCALAPPDATA/wptsall-client" --strip-components=1
          test -f "$LOCALAPPDATA/wptsall-client/bin/wptsall-client.exe"
          echo "PASS: windows kit extract ${{ matrix.platform }}"

  publish:
    needs: [pack-desktop, pack-webui]
    if: |
      always() && inputs.publish &&
      (needs.pack-desktop.result == 'success' || needs.pack-webui.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create packed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}-${{ inputs.type }}"
          TITLE="WPTSALL Client (${{ inputs.type }}) ${{ inputs.version }}"
          mkdir -p upload
          find assets -type f \( -name 'wptsall-client-webui-*.tar.gz' -o -name 'SHA256SUMS-*.txt' -o -name 'wptsall-client-*' \) -exec cp {} upload/ \;
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" upload/* --clobber || \
            gh release create "$TAG" upload/* --title "$TITLE" --notes "Packed from signed kits. Verify installs against kits-webui-v* minisign kits."
