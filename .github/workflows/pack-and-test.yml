name: Pack and Test

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0)'
        required: true
      kit_tag:
        description: 'Kit prerelease tag (e.g. kits-v2.1.0 or kits-webui-v2.1.0)'
        required: true
      publish:
        description: 'Publish release assets'
        type: boolean
        default: false
      type:
        description: 'Package type: desktop or webui'
        type: choice
        options:
          - desktop
          - webui
        default: desktop

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # DESKTOP: Pack kits into platform installers
  # ═══════════════════════════════════════════════════════════════════════════
  pack-desktop:
    if: inputs.type == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            kinds: tree,deb,appimage
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            kinds: tree,deb,appimage
          - os: windows-latest
            platform: windows-x86_64
            kinds: tree,nsis,portable
          - os: windows-11-arm
            platform: windows-aarch64
            kinds: tree,portable
          - os: macos-latest
            platform: darwin-aarch64
            kinds: tree,dmg
          - os: macos-latest
            platform: darwin-x86_64
            kinds: tree,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download kit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/kits
          gh release download ${{ inputs.kit_tag }} -p "kit-${{ matrix.platform }}.tar.gz" -D dist/kits || echo "::warning::Kit not available for ${{ matrix.platform }}"

      - name: Pack kit to release
        shell: bash
        if: hashFiles(format('dist/kits/kit-{0}.tar.gz', matrix.platform)) != ''
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
          WPTSALL_PACK_KINDS: ${{ matrix.kinds }}
          KIT: dist/kits/kit-${{ matrix.platform }}.tar.gz
        run: bash scripts/pack-kit-to-release.sh

      - name: Upload artifacts
        if: hashFiles('dist/release-assets/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/release-assets/*

  # ═══════════════════════════════════════════════════════════════════════════
  # WEBUI: Pack kits into simple tarballs
  # ═══════════════════════════════════════════════════════════════════════════
  pack-webui:
    if: inputs.type == 'webui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-arm
            platform: windows-aarch64
          - os: macos-latest
            platform: darwin-aarch64
          - os: macos-latest
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download kit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/kits
          gh release download ${{ inputs.kit_tag }} -p "kit-webui-${{ matrix.platform }}.tar.gz" -D dist/kits || echo "::warning::WebUI kit not available for ${{ matrix.platform }}"

      - name: Repack for release
        shell: bash
        if: hashFiles(format('dist/kits/kit-webui-{0}.tar.gz', matrix.platform)) != ''
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist/release-assets dist/staging
          tar -xzf "dist/kits/kit-webui-${{ matrix.platform }}.tar.gz" -C dist/staging
          mv dist/staging/wptsall-client-webui "dist/staging/wptsall-client-webui-${{ inputs.version }}"
          tar -czf "dist/release-assets/wptsall-client-webui-${{ inputs.version }}-${{ matrix.platform }}.tar.gz" -C dist/staging "wptsall-client-webui-${{ inputs.version }}"
          cd dist/release-assets
          sha256sum *.tar.gz > "SHA256SUMS-${{ matrix.platform }}.txt" || shasum -a 256 *.tar.gz > "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Upload artifacts
        if: hashFiles('dist/release-assets/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: webui-${{ matrix.platform }}
          path: dist/release-assets/*

  # ═══════════════════════════════════════════════════════════════════════════
  # PUBLISH: Aggregate and create GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════
  publish:
    needs: [pack-desktop, pack-webui]
    if: |
      always() && inputs.publish &&
      (needs.pack-desktop.result == 'success' || needs.pack-webui.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Merge SHA256SUMS
        shell: bash
        run: |
          cd assets
          cat SHA256SUMS-*.txt 2>/dev/null > RELEASE-SHA256SUMS.txt || true
          rm -f SHA256SUMS-*.txt

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}-${{ inputs.type }}"
          TITLE="WPTSALL Client (${{ inputs.type }}) ${{ inputs.version }}"
          gh release create "$TAG" assets/* --title "$TITLE" --notes "Automated release"

  # ═══════════════════════════════════════════════════════════════════════════
  # INSTALL TEST: Desktop
  # ═══════════════════════════════════════════════════════════════════════════
  install-test-desktop:
    needs: publish
    if: always() && needs.publish.result == 'success' && inputs.type == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WPTSALL_VERSION: ${{ inputs.version }}
        run: bash scripts/install-from-release.sh --platform ${{ matrix.platform }}
      - name: Smoke test
        shell: bash
        run: bash scripts/smoke-test.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # INSTALL TEST: WebUI (sh on Linux/macOS)
  # ═══════════════════════════════════════════════════════════════════════════
  install-test-webui-sh:
    needs: publish
    if: always() && needs.publish.result == 'success' && inputs.type == 'webui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test install.sh
        shell: bash
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
        run: |
          # Download directly from the release we just created
          ASSET="wptsall-client-webui-${{ inputs.version }}-${{ matrix.platform }}.tar.gz"
          TAG="v${{ inputs.version }}-webui"
          gh release download "$TAG" -p "$ASSET" -D /tmp/ || { echo "::warning::Asset $ASSET not in release, skip"; exit 0; }
          mkdir -p "$HOME/.local/opt/wptsall-client"
          tar -xzf "/tmp/$ASSET" -C "$HOME/.local/opt/wptsall-client" --strip-components=1
          chmod +x "$HOME/.local/opt/wptsall-client/bin/"* 2>/dev/null || true
          test -x "$HOME/.local/opt/wptsall-client/bin/wptsall-client"
          "$HOME/.local/opt/wptsall-client/bin/wptsall-client" --version || true
          echo "PASS: install test on ${{ matrix.platform }}"

  # ═══════════════════════════════════════════════════════════════════════════
  # INSTALL TEST: WebUI (PowerShell on Windows)
  # ═══════════════════════════════════════════════════════════════════════════
  install-test-webui-ps1:
    needs: publish
    if: always() && needs.publish.result == 'success' && inputs.type == 'webui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-arm
            platform: windows-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test install.ps1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="wptsall-client-webui-${{ inputs.version }}-${{ matrix.platform }}.tar.gz"
          TAG="v${{ inputs.version }}-webui"
          gh release download "$TAG" -p "$ASSET" -D /tmp/ || { echo "::warning::Asset $ASSET not in release, skip"; exit 0; }
          mkdir -p "$LOCALAPPDATA/wptsall-client"
          tar -xzf "/tmp/$ASSET" -C "$LOCALAPPDATA/wptsall-client" --strip-components=1
          test -f "$LOCALAPPDATA/wptsall-client/bin/wptsall-client.exe" || { echo "::warning::No exe for this platform"; exit 0; }
          "$LOCALAPPDATA/wptsall-client/bin/wptsall-client.exe" --version || true
          echo "PASS: install test on ${{ matrix.platform }}"
