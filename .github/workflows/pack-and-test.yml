name: Pack and Test

# Canonical copy: install-client/workflows/pack-and-test.yml
# Sync to wpmmcc/wptsall-client-releases via packaging/webui/sync-public-repo.sh
#
# Dual clients (see DUAL-CLIENTS.md / CURRENT-FOCUS.md):
#   type=webui   → download kit-webui-*, pack user tarball, install/OTA smoke
#   type=desktop → download kit-desktop-*, pack deb/AppImage/dmg/nsis (+ tree)
# Runners never cargo-build production binaries or hold the minisign private key.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0)'
        required: true
      kit_tag:
        description: 'Kit prerelease tag (e.g. kits-webui-v2.1.0)'
        required: true
      publish:
        description: 'Publish packed release assets (optional; install tests do not require this)'
        type: boolean
        default: false
      type:
        description: 'Package type'
        type: choice
        options:
          - webui
          - desktop
        default: webui

jobs:
  pack-desktop:
    if: inputs.type == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            kinds: tree,deb,appimage
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            kinds: tree,deb,appimage
          - os: windows-latest
            platform: windows-x86_64
            kinds: tree,nsis,portable
          - os: windows-11-arm
            platform: windows-aarch64
            kinds: tree,portable
          - os: macos-latest
            platform: darwin-aarch64
            kinds: tree,dmg
          - os: macos-latest
            platform: darwin-x86_64
            kinds: tree,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download kit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/kits
          gh release download "${{ inputs.kit_tag }}" \
            -p "kit-desktop-${{ matrix.platform }}.tar.gz" \
            -p "kit-desktop-${{ matrix.platform }}.tar.gz.minisig" \
            -D dist/kits
          test -f "dist/kits/kit-desktop-${{ matrix.platform }}.tar.gz"
          test -f "dist/kits/kit-desktop-${{ matrix.platform }}.tar.gz.minisig"
      - name: Verify minisign
        if: hashFiles(format('dist/kits/kit-desktop-{0}.tar.gz', matrix.platform)) != ''
        shell: bash
        run: |
          bash shared/install-minisign-ci.sh
          PUB='RWR7lrdabZEEywfWEfrRJXIyP5h+LHEabOA8JFiNJ3vGLpNtppyabHfP'
          test -f "dist/kits/kit-desktop-${{ matrix.platform }}.tar.gz.minisig"
          minisign -Vm "dist/kits/kit-desktop-${{ matrix.platform }}.tar.gz" -P "$PUB" \
            -x "dist/kits/kit-desktop-${{ matrix.platform }}.tar.gz.minisig"
          echo "signature_verified=true platform=${{ matrix.platform }}"
      - name: Pack kit to release
        shell: bash
        if: hashFiles(format('dist/kits/kit-desktop-{0}.tar.gz', matrix.platform)) != ''
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
          WPTSALL_PACK_KINDS: ${{ matrix.kinds }}
          KIT: dist/kits/kit-desktop-${{ matrix.platform }}.tar.gz
        run: |
          bash packaging/desktop/pack-kit-to-release.sh || bash scripts/pack-kit-to-release.sh
          mkdir -p ci-out
          cp dist/kits/kit-desktop-${{ matrix.platform }}.tar.gz ci-out/
          cp dist/kits/kit-desktop-${{ matrix.platform }}.tar.gz.minisig ci-out/
      - name: Upload artifacts
        if: hashFiles('dist/release-assets/*') != '' || hashFiles('ci-out/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/release-assets/*
            ci-out/*

  pack-webui:
    if: inputs.type == 'webui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-arm
            platform: windows-aarch64
          - os: macos-latest
            platform: darwin-aarch64
          - os: macos-latest
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download signed kit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/kits
          gh release download "${{ inputs.kit_tag }}" \
            -p "kit-webui-${{ matrix.platform }}.tar.gz" \
            -p "kit-webui-${{ matrix.platform }}.tar.gz.minisig" \
            -p "RELEASE-SHA256SUMS-webui.txt" \
            -p "RELEASE-SHA256SUMS-webui.txt.minisig" \
            -D dist/kits
          test -f "dist/kits/kit-webui-${{ matrix.platform }}.tar.gz"
      - name: Verify minisign
        shell: bash
        run: |
          bash shared/install-minisign-ci.sh
          PUB='RWR7lrdabZEEywfWEfrRJXIyP5h+LHEabOA8JFiNJ3vGLpNtppyabHfP'
          minisign -Vm "dist/kits/kit-webui-${{ matrix.platform }}.tar.gz" -P "$PUB" \
            -x "dist/kits/kit-webui-${{ matrix.platform }}.tar.gz.minisig"
          echo "signature_verified=true platform=${{ matrix.platform }}"
      - name: Pack kit (user tarball)
        shell: bash
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
          KIT: dist/kits/kit-webui-${{ matrix.platform }}.tar.gz
        run: |
          if [ -x packaging/webui/pack-kit-to-release.sh ]; then
            bash packaging/webui/pack-kit-to-release.sh
          else
            mkdir -p dist/release-assets dist/staging
            tar -xzf "$KIT" -C dist/staging
            tar -czf "dist/release-assets/wptsall-client-webui-${{ inputs.version }}-${{ matrix.platform }}.tar.gz" -C dist/staging .
          fi
          mkdir -p ci-out
          cp dist/kits/kit-webui-${{ matrix.platform }}.tar.gz ci-out/
          cp dist/kits/kit-webui-${{ matrix.platform }}.tar.gz.minisig ci-out/
          cp dist/release-assets/* ci-out/ 2>/dev/null || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webui-${{ matrix.platform }}
          path: ci-out/*
  install-test-webui-sh:
    needs: pack-webui
    if: always() && needs.pack-webui.result == 'success' && inputs.type == 'webui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-${{ matrix.platform }}
          path: ci-assets
      - name: Install minisign
        run: bash shared/install-minisign-ci.sh
      - name: Serve signed kit + run install-webui.sh
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p /tmp/kit-http
          cp ci-assets/kit-webui-${{ matrix.platform }}.tar.gz /tmp/kit-http/
          cp ci-assets/kit-webui-${{ matrix.platform }}.tar.gz.minisig /tmp/kit-http/ || true
          (cd /tmp/kit-http && sha256sum kit-webui-*.tar.gz > RELEASE-SHA256SUMS-webui.txt || shasum -a 256 kit-webui-*.tar.gz > RELEASE-SHA256SUMS-webui.txt)
          (cd /tmp/kit-http && python3 -m http.server 8765 --bind 127.0.0.1) &
          HTTP_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ >/dev/null || { echo "local kit HTTP server failed"; kill "$HTTP_PID" 2>/dev/null || true; exit 1; }
          PREFIX="$HOME/.local/opt/wptsall-client-ci"
          rm -rf "$PREFIX"
          WPTSALL_DOWNLOAD_BASE="http://127.0.0.1:8765" \
            bash "${GITHUB_WORKSPACE}/installers/install-webui.sh" --version "${WPTSALL_VERSION}" --prefix "$PREFIX" --no-service --no-link
          bash "${GITHUB_WORKSPACE}/shared/smoke-test-webui.sh" "$PREFIX"
          kill "$HTTP_PID" 2>/dev/null || true

  install-test-webui-ps1:
    needs: pack-webui
    if: always() && needs.pack-webui.result == 'success' && inputs.type == 'webui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-arm
            platform: windows-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-${{ matrix.platform }}
          path: ci-assets
      - name: Install minisign
        shell: bash
        run: bash shared/install-minisign-ci.sh
      - name: Serve signed kit + run install-webui.ps1
        shell: pwsh
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $HttpDir = Join-Path $env:RUNNER_TEMP 'kit-http-webui'
          New-Item -ItemType Directory -Force -Path $HttpDir | Out-Null
          Copy-Item "ci-assets/kit-webui-${{ matrix.platform }}.tar.gz" $HttpDir
          Copy-Item "ci-assets/kit-webui-${{ matrix.platform }}.tar.gz.minisig" $HttpDir
          $Kit = Join-Path $HttpDir "kit-webui-${{ matrix.platform }}.tar.gz"
          $Hash = (Get-FileHash $Kit -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $HttpDir 'RELEASE-SHA256SUMS-webui.txt') -Value "$Hash  kit-webui-${{ matrix.platform }}.tar.gz"
          $Server = Start-Job -ScriptBlock { param($dir) Set-Location $dir; python -m http.server 8765 --bind 127.0.0.1 } -ArgumentList $HttpDir
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            $InstallDir = Join-Path $env:RUNNER_TEMP 'wptsall-client-ci-win'
            Remove-Item -Recurse -Force $InstallDir -ErrorAction SilentlyContinue
            powershell -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE/installers/install-webui.ps1" -Version $env:WPTSALL_VERSION -InstallPath $InstallDir -DownloadBase 'http://127.0.0.1:8765' -NoPath -NoStartup
            if (-not (Test-Path (Join-Path $InstallDir 'bin/wptsall-client.exe'))) { throw 'installed wptsall-client.exe missing' }
          } finally {
            Stop-Job $Server -ErrorAction SilentlyContinue | Out-Null
            Remove-Job $Server -Force -ErrorAction SilentlyContinue
          }

  install-test-desktop-ps1:
    needs: pack-desktop
    if: always() && needs.pack-desktop.result == 'success' && inputs.type == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-arm
            platform: windows-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ci-assets
      - name: Install minisign
        shell: bash
        run: bash shared/install-minisign-ci.sh
      - name: Serve signed kit + run install-desktop.ps1 + tamper negative
        shell: pwsh
        env:
          WPTSALL_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Asset = "kit-desktop-${{ matrix.platform }}.tar.gz"
          $HttpDir = Join-Path $env:RUNNER_TEMP 'kit-http-desktop'
          New-Item -ItemType Directory -Force -Path $HttpDir | Out-Null
          Copy-Item "ci-assets/$Asset" $HttpDir
          Copy-Item "ci-assets/$Asset.minisig" $HttpDir
          $Kit = Join-Path $HttpDir $Asset
          $Hash = (Get-FileHash $Kit -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $HttpDir 'RELEASE-SHA256SUMS-desktop.txt') -Value "$Hash  $Asset"
          $Server = Start-Job -ScriptBlock { param($dir) Set-Location $dir; python -m http.server 8765 --bind 127.0.0.1 } -ArgumentList $HttpDir
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            $InstallDir = Join-Path $env:RUNNER_TEMP 'wptsall-desktop-ci-win'
            Remove-Item -Recurse -Force $InstallDir -ErrorAction SilentlyContinue
            powershell -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE/installers/install-desktop.ps1" -Version $env:WPTSALL_VERSION -Platform '${{ matrix.platform }}' -InstallPath $InstallDir -DownloadBase 'http://127.0.0.1:8765' -NoPath -NoStartup
            if (-not (Test-Path (Join-Path $InstallDir 'bin/wptsall-client.exe'))) { throw 'installed desktop wptsall-client.exe missing' }
          } finally {
            Stop-Job $Server -ErrorAction SilentlyContinue | Out-Null
            Remove-Job $Server -Force -ErrorAction SilentlyContinue
          }

          $BadDir = Join-Path $env:RUNNER_TEMP 'kit-http-desktop-tampered'
          New-Item -ItemType Directory -Force -Path $BadDir | Out-Null
          Copy-Item "ci-assets/$Asset" $BadDir
          Copy-Item "ci-assets/$Asset.minisig" $BadDir
          Add-Content -Path (Join-Path $BadDir $Asset) -Value 'tamper'
          $BadServer = Start-Job -ScriptBlock { param($dir) Set-Location $dir; python -m http.server 8766 --bind 127.0.0.1 } -ArgumentList $BadDir
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -Uri 'http://127.0.0.1:8766/' -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            $BadInstallDir = Join-Path $env:RUNNER_TEMP 'wptsall-desktop-ci-bad'
            $proc = Start-Process -FilePath powershell -Wait -PassThru -ArgumentList @('-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE/installers/install-desktop.ps1",'-Version',$env:WPTSALL_VERSION,'-Platform','${{ matrix.platform }}','-InstallPath',$BadInstallDir,'-DownloadBase','http://127.0.0.1:8766','-NoPath','-NoStartup')
            if ($proc.ExitCode -eq 0) { throw 'tampered desktop kit unexpectedly installed' }
            Write-Host "PASS: tampered desktop kit rejected"
          } finally {
            Stop-Job $BadServer -ErrorAction SilentlyContinue | Out-Null
            Remove-Job $BadServer -Force -ErrorAction SilentlyContinue
          }

  publish:
    needs: [pack-desktop, pack-webui]
    if: |
      always() && inputs.publish &&
      (needs.pack-desktop.result == 'success' || needs.pack-webui.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create packed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}-${{ inputs.type }}"
          TITLE="WPTSALL Client (${{ inputs.type }}) ${{ inputs.version }}"
          mkdir -p upload
          find assets -type f \( -name 'wptsall-client-webui-*.tar.gz' -o -name 'SHA256SUMS-*.txt' -o -name 'wptsall-client-*' \) -exec cp {} upload/ \;
          bash packaging/assert-no-source-publish.sh upload
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" upload/* --clobber || \
            gh release create "$TAG" upload/* --title "$TITLE" --notes "Packed from signed kits. Verify installs against kits-*-v* minisign kits."
